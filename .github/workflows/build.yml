name: Build MouseMobile
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: unzip -q MouseMobile-native-kop.zip
      - name: Apply PIN crash fix
        run: git apply MouseMobile-pin-crash-fix.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: MouseMobile
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MouseMobile-apk
          path: MouseMobile/app/build/outputs/apk/debug/app-debug.apk

  windows-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: Expand-Archive -Path MouseMobile-native-kop.zip -DestinationPath . -Force
        shell: pwsh
      - name: Apply PIN crash fix
        run: git apply MouseMobile-pin-crash-fix.patch
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone Windows server
        run: dotnet publish MouseMobile/pc-server-native/MouseMobileServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o MouseMobile-Windows-Server
      - name: Zip server
        run: Compress-Archive -Path MouseMobile-Windows-Server/* -DestinationPath MouseMobile-Windows-Server.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: MouseMobile-Windows-Server
          path: MouseMobile-Windows-Server.zip
