name: Build MouseMobile # verified patch
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: unzip -q MouseMobile-native-kop.zip
      - name: Apply PIN crash fix
        run: git apply MouseMobile-pin-crash-fix.patch
      - name: Apply fullscreen and pinch-zoom improvements
        run: git apply MouseMobile-ui-enhancements.patch
      - name: Fit full desktop and add pan gesture
        run: git apply MouseMobile-fit-pan.patch
      - name: Verify keyboard, clicks, image quality and app styling patch
        run: git apply --check MouseMobile-input-quality.patch
      - name: Improve keyboard, clicks, image quality and app styling
        run: git apply MouseMobile-input-quality.patch
      - name: Add compact navigation, settings and support screens
        run: base64 -d MouseMobile-app-navigation.patch | gzip -dc | git apply
      - name: Correct fullscreen state and connection wording
        run: git apply MouseMobile-app-corrections.patch
      - name: Package exact build sources for review
        run: zip -qr MouseMobile-build-source.zip MouseMobile
      - name: Upload build sources
        uses: actions/upload-artifact@v4
        with:
          name: MouseMobile-build-source
          path: MouseMobile-build-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: MouseMobile
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MouseMobile-apk
          path: MouseMobile/app/build/outputs/apk/debug/app-debug.apk

