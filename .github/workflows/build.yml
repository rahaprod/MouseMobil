name: Build MouseMobile # verified patch
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: unzip -q MouseMobile-native-kop.zip
      - name: Apply PIN crash fix
        run: git apply MouseMobile-pin-crash-fix.patch
      - name: Apply fullscreen and pinch-zoom improvements
        run: git apply MouseMobile-ui-enhancements.patch
      - name: Fit full desktop and add pan gesture
        run: git apply MouseMobile-fit-pan.patch
      - name: Verify keyboard, clicks, image quality and app styling patch
        run: git apply --check MouseMobile-input-quality.patch
      - name: Improve keyboard, clicks, image quality and app styling
        run: git apply MouseMobile-input-quality.patch
      - name: Add compact navigation, settings and support screens
        run: base64 -d MouseMobile-app-navigation.patch | gzip -dc | git apply
      - name: Correct fullscreen state and connection wording
        run: git apply MouseMobile-app-corrections.patch
      - name: Add official Telegram channel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MouseMobile/app/src/main/java/com/mousemobile/app/MainActivity.kt')
          s = p.read_text()
          old = '        content.addView(card("Новости MouseMobile", "Следите за обновлениями и новостями приложения в нашем Telegram-канале. Ссылка на канал будет добавлена."), lp())'
          new = '''        val telegramCard = card("Новости MouseMobile", "Следите за обновлениями и новостями приложения в нашем Telegram-канале. Нажми, чтобы открыть канал @mousemobileru.").apply {
              isClickable = true
              isFocusable = true
              background = rippled(Pal.CARD)
              setOnClickListener {
                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/mousemobileru"))
                  try {
                      startActivity(intent)
                  } catch (_: Exception) {
                      Toast.makeText(this@MainActivity, "Не удалось открыть Telegram-канал", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          content.addView(telegramCard, lp())'''
          if s.count(old) != 1:
              raise SystemExit('Expected one Telegram placeholder; found %d' % s.count(old))
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify Telegram channel integration
        run: grep -q 'https://t.me/mousemobileru' MouseMobile/app/src/main/java/com/mousemobile/app/MainActivity.kt
      - name: Package exact build sources for review
        run: zip -qr MouseMobile-build-source.zip MouseMobile
      - name: Upload build sources
        uses: actions/upload-artifact@v4
        with:
          name: MouseMobile-build-source
          path: MouseMobile-build-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: MouseMobile
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MouseMobile-apk
          path: MouseMobile/app/build/outputs/apk/debug/app-debug.apk

